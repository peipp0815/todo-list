<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <div id="container">
      <nav>
        <button>Home</button>
        <button>Calendar</button>
        <button>Inbox</button>
        <button>Projects</button>
        <button>New Project</button>
      </nav>
      <div id="main-content"></div>
      <dialog id="new-todo">
        <form action="" method="post" autocomplete="off">
          <label for="todo-title">Title</label>
          <input type="text" name="todo-title" id="todo-title" />
          <label for="todo-description">Description</label>
          <input type="text" name="todo-description" id="todo-description" />
          <label for="todo-dueDate">Due date</label>
          <input type="date" name="todo-dueDate" id="todo-dueDate" />
          <label for="todo-priority">Priority</label>
          <select name="todo-priority" id="todo-priority">
            <option value="">--- Choose one ---</option>
            <option value="p1">P1 / needs to get done</option>
            <option value="p2">P2 / should get done</option>
            <option value="p3">P3 / would be nice to get done</option>
          </select>
          <button id="add-new-todo">Add Todo</button>
        </form>
      </dialog>
    </div>
  </body>
</html>
