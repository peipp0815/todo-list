<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo List</title><script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script><script defer="defer" src="app.bundle.js"></script></head><body><div id="container"><nav><button id="nav-home">Home</button> <button id="nav-calendar">Calendar</button> <button disabled="disabled"></button> <button disabled="disabled"></button> <button disabled="disabled">Projects</button> <button command="show-modal" commandfor="new-project" id="nav-new-project">New Project</button><div id="nav-projects"><button id="nav-inbox">Inbox</button></div></nav><div id="main-content"></div><dialog id="new-todo"><div class="close-btn"><button commandfor="new-todo" command="close">X</button></div><form action="" method="dialog" id="new-todo-form"><label for="todo-title">Title</label> <input name="todo-title" id="todo-title"/> <label for="todo-description">Description</label> <textarea name="todo-description" id="todo-description"> </textarea> <label for="todo-dueDate">Due date</label> <input type="date" name="todo-dueDate" id="todo-dueDate"/> <label for="todo-priority">Priority</label> <select name="todo-priority" id="todo-priority"><option value="">--- Choose one ---</option><option value="p1">P1 / needs to get done</option><option value="p2">P2 / should get done</option><option value="p3">P3 / would be nice to get done</option></select> <button id="add-new-todo">Add Todo</button></form></dialog><dialog id="new-project"><div class="close-btn"><button commandfor="new-project" command="close">X</button></div><form action="" method="dialog" id="new-project-form"><label for="project-name">Name</label> <input name="project-name" id="project-name"/> <button class="add-new-project">Add Project</button></form></dialog><dialog id="calendar-todo-list"><div class="close-btn"><button commandfor="calendar-todo-list" command="close">X</button></div><div id="calendar-todos-container"></div></dialog></div></body></html>
